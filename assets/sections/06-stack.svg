<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="01: Stack">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#a8ecf0"/><stop offset="1" stop-color="#a9cdfb"/></linearGradient></defs>
<rect width="1200" height="96" rx="14" fill="#1f1d2b"/>
<g opacity="0"><animate attributeName="opacity" to="1" begin="0.1s" dur="0.5s" fill="freeze"/><text x="40" y="60" font-size="30" fill="#a8ecf0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" >01</text></g>
<g opacity="0"><animate attributeName="opacity" to="1" begin="0.3s" dur="0.5s" fill="freeze"/><text x="104" y="52" font-size="30" fill="#f4f1fb" text-anchor="start" font-weight="700" >Stack</text><text x="104" y="76" font-size="14" fill="#b7b2cc" text-anchor="start" >Ferramentas do dia a dia, agrupadas por área</text></g>
<g opacity="0"><animate attributeName="opacity" to="1" begin="0.6s" dur="0.5s" fill="freeze"/><rect x="1010" y="30" width="150" height="34" rx="17" fill="none" stroke="#a8ecf0" stroke-width="1.2" ></rect><text x="1085" y="52" font-size="13" fill="#a8ecf0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >7 áreas</text></g>
<rect x="0" y="92" width="0" height="3" rx="1.5" fill="url(#g)"><animate attributeName="width" to="1200" begin="0.3s" dur="1.2s" fill="freeze"/></rect>
<circle cx="0" cy="93.5" r="4" fill="#a8ecf0" opacity="0"><animate attributeName="cx" values="0;1200" dur="4s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="1.5s" repeatCount="indefinite"/></circle>
</svg>