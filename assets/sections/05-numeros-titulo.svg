<g opacity="0"><animate attributeName="opacity" to="1" begin="0.3s" dur="0.5s" fill="freeze"/><text x="104" y="52" font-size="30" fill="#e6edf3" text-anchor="start" font-weight="700" >Código em números</text><text x="104" y="76" font-size="14" fill="#8b96a8" text-anchor="start" >Panorama dos repositórios das duas contas</text></g>
